name: Build basemaps

# Publishes bounded Protomaps Basemap archives (see regions.json) as a GitHub release.
# Runs when the region list or build script changes, monthly, or on demand.
on:
  push:
    branches: [main]
    paths:
      - regions.json
      - scripts/build.py
      - .github/workflows/build.yml
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
    inputs:
      planet_date:
        description: "Pin a Protomaps planet build (YYYYMMDD); blank = newest"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-basemaps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Install pmtiles CLI (pinned, checksum verified)
        run: |
          curl -fsSL -o pmtiles.tar.gz \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          echo "3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  pmtiles.tar.gz" | sha256sum -c - \
            || { echo "::error title=pmtiles install::checksum mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf pmtiles.tar.gz -C "$RUNNER_TEMP/bin" pmtiles
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "::notice title=pmtiles::$("$RUNNER_TEMP/bin/pmtiles" version 2>&1 | head -1)"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLANET_DATE: ${{ inputs.planet_date }}
        run: python3 scripts/build.py
